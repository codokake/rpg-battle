<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>てきをたおせ！バトル画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --window-bg: #10122b;
    --window-border-outer: #4a4e8f;
    --window-border-inner: #f4f1e0;
    --text-main: #f4f1e0;
    --hp-green: #5fd068;
    --hp-yellow: #e8c547;
    --hp-red: #e0503a;
    --accent-gold: #f2c14e;
    --floor-1: #2b2650;
    --floor-2: #1c1938;
    --sky-top: #241b4e;
    --sky-bottom: #4b3a7a;
  }

  * { box-sizing: border-box; }

  /* ---------- Ura (dark) mode palette override ---------- */
  .console.ura-mode{
    --window-bg: #170606;
    --window-border-outer: #5a0f0f;
    --window-border-inner: #d8c4b0;
    --text-main: #e9d9c9;
    --accent-gold: #e2574c;
    --floor-1: #2a0808;
    --floor-2: #150404;
    --sky-top: #170303;
    --sky-bottom: #4a0d0d;
    --hp-green: #8a2323;
    --hp-yellow: #b3382c;
    --hp-red: #ff4a33;
  }

  body{
    margin:0;
    min-height:100vh;
    background: #050512;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'DotGothic16', sans-serif;
    color: var(--text-main);
    padding: 24px 12px;
    overflow-x:hidden;
  }

  .console{
    width:100%;
    max-width: 480px;
    background: #050512;
    border: 6px solid #2a2a52;
    border-radius: 4px;
    box-shadow: 0 0 0 3px #050512, 0 20px 60px rgba(0,0,0,0.6);
    padding: 10px;
  }

  .title-row{
    text-align:center;
    font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--accent-gold);
    padding: 6px 0 10px;
  }

  /* ---------- Battle stage ---------- */
  .stage{
    position:relative;
    height: 300px;
    border: 3px solid var(--window-border-inner);
    box-shadow: 0 0 0 3px var(--window-border-outer);
    border-radius: 2px;
    overflow:hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 55%);
  }

  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(2px 2px at 90px 15px, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 150px 45px, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 220px 20px, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 300px 35px, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 350px 10px, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60px 70px, rgba(255,255,255,0.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 260px 65px, rgba(255,255,255,0.3) 50%, transparent 51%);
    opacity:0.9;
  }

  .floor{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 42%;
    background:
      repeating-linear-gradient(90deg, var(--floor-1) 0 28px, var(--floor-2) 28px 56px);
    transform: perspective(220px) rotateX(35deg);
    transform-origin: bottom;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.5) inset;
  }

  .enemy-zone{
    position:absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 210px;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:3;
  }

  .hp-panel{
    background: rgba(16,18,43,0.85);
    border: 2px solid var(--window-border-inner);
    border-radius: 3px;
    padding: 5px 10px;
    width: 100%;
    margin-bottom: 10px;
    font-size: 11px;
  }
  .hp-panel .name-row{
    display:flex;
    justify-content:space-between;
    margin-bottom: 4px;
  }
  .hp-bar-track{
    height: 10px;
    background:#0a0a1e;
    border: 1px solid var(--window-border-inner);
    border-radius: 2px;
    overflow:hidden;
  }
  .hp-bar-fill{
    height:100%;
    width:100%;
    background: linear-gradient(#8bf08f, var(--hp-green));
    transition: width 0.6s cubic-bezier(.4,0,.2,1), background 0.6s;
  }
  .hp-bar-fill.mid{ background: linear-gradient(#f2df8a, var(--hp-yellow)); }
  .hp-bar-fill.low{ background: linear-gradient(#f0917f, var(--hp-red)); }

  .enemy-frame{
    position:relative;
    width: 168px;
    height: 168px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .enemy-img-wrap{
    width: 100%;
    height: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    image-rendering: auto;
  }
  .enemy-img-wrap img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,0.5));
  }

  .enemy-placeholder{
    width: 120px;
    height: 120px;
    border: 2px dashed rgba(244,241,224,0.5);
    border-radius: 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size: 10px;
    line-height: 1.6;
    padding: 10px;
    color: rgba(244,241,224,0.75);
    cursor:pointer;
  }
  .enemy-placeholder:hover{ border-color: var(--accent-gold); color: var(--accent-gold); }

  /* animation states applied to enemy-frame */
  .enemy-frame.shake{ animation: shake 0.5s; }
  @keyframes shake{
    10%,90% { transform: translateX(-2px); }
    20%,80% { transform: translateX(4px); }
    30%,50%,70% { transform: translateX(-8px); }
    40%,60% { transform: translateX(8px); }
  }

  .enemy-frame.flash .enemy-img-wrap img,
  .enemy-frame.flash .enemy-placeholder{
    animation: flashwhite 0.5s steps(2, jump-none) 2;
  }
  @keyframes flashwhite{
    0%,100%{ filter: drop-shadow(0 8px 6px rgba(0,0,0,0.5)) brightness(1); }
    50%{ filter: drop-shadow(0 8px 6px rgba(0,0,0,0.5)) brightness(3) saturate(0) drop-shadow(0 0 16px #fff); }
  }

  .enemy-frame.defeated .enemy-img-wrap img,
  .enemy-frame.defeated .enemy-placeholder{
    filter: grayscale(1) brightness(0.6);
    transform: rotate(90deg) translateY(30px);
    opacity: 0.4;
    transition: transform 0.8s ease-in, opacity 0.8s ease-in, filter 0.8s;
  }

  /* slash effect */
  .slash{
    position:absolute;
    top:50%; left:50%;
    width: 260px;
    height: 6px;
    background: linear-gradient(90deg, transparent, #ffffff 20%, #ffffff 80%, transparent);
    transform: translate(-50%,-50%) rotate(-35deg) scaleX(0);
    transform-origin:center;
    opacity:0;
    pointer-events:none;
    z-index: 5;
    box-shadow: 0 0 12px 2px rgba(255,255,255,0.9);
  }
  .slash.slash2{ transform: translate(-50%,-50%) rotate(35deg) scaleX(0); }
  .slash.play{
    animation: slashPlay 0.35s ease-out forwards;
  }
  @keyframes slashPlay{
    0%{ opacity:0; transform: translate(-50%,-50%) rotate(-35deg) scaleX(0); }
    15%{ opacity:1; }
    55%{ opacity:1; transform: translate(-50%,-50%) rotate(-35deg) scaleX(1); }
    100%{ opacity:0; transform: translate(-50%,-50%) rotate(-35deg) scaleX(1); }
  }
  .slash.slash2.play{
    animation-name: slashPlay2;
  }
  @keyframes slashPlay2{
    0%{ opacity:0; transform: translate(-50%,-50%) rotate(35deg) scaleX(0); }
    15%{ opacity:1; }
    55%{ opacity:1; transform: translate(-50%,-50%) rotate(35deg) scaleX(1); }
    100%{ opacity:0; transform: translate(-50%,-50%) rotate(35deg) scaleX(1); }
  }

  .damage-pop{
    position:absolute;
    top: 30%;
    left:50%;
    transform: translate(-50%, 0);
    font-family: 'Press Start 2P', sans-serif;
    font-size: 20px;
    color: var(--accent-gold);
    text-shadow: 2px 2px 0 #7a2b00, -1px -1px 0 #000;
    opacity:0;
    z-index:6;
    pointer-events:none;
  }
  .damage-pop.play{
    animation: dmgPop 0.9s ease-out forwards;
  }
  @keyframes dmgPop{
    0%{ opacity:0; transform: translate(-50%, 20px) scale(0.6); }
    20%{ opacity:1; transform: translate(-50%, -10px) scale(1.15); }
    35%{ transform: translate(-50%, -14px) scale(1); }
    100%{ opacity:0; transform: translate(-50%, -40px) scale(1); }
  }

  .screen-flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    z-index:8;
    pointer-events:none;
  }
  .screen-flash.play{
    animation: screenFlash 0.28s ease-out;
  }
  @keyframes screenFlash{
    0%{ opacity:0; }
    30%{ opacity:0.85; }
    100%{ opacity:0; }
  }

  .heal-flash{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 45%, rgba(151,255,169,0.9) 0%, rgba(151,255,169,0.35) 40%, transparent 70%);
    opacity:0;
    z-index:8;
    pointer-events:none;
  }
  .heal-flash.play{
    animation: healFlash 0.9s ease-out;
  }
  @keyframes healFlash{
    0%{ opacity:0; }
    25%{ opacity:1; }
    100%{ opacity:0; }
  }

  .sparkles{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:9;
  }
  .sparkle{
    position:absolute;
    color:#a6ffb0;
    text-shadow: 0 0 6px #d6ffda;
    font-size: 16px;
    opacity:0;
  }
  .sparkle.s1{ left: 30%; bottom: 30%; }
  .sparkle.s2{ left: 65%; bottom: 25%; font-size:12px; }
  .sparkle.s3{ left: 45%; bottom: 45%; font-size:20px; }
  .sparkle.s4{ left: 20%; bottom: 55%; font-size:12px; }
  .sparkle.s5{ left: 75%; bottom: 50%; font-size:14px; }
  .sparkle.play{ animation: sparkleRise 1s ease-out forwards; }
  .sparkle.s1.play{ animation-delay: 0s; }
  .sparkle.s2.play{ animation-delay: 0.08s; }
  .sparkle.s3.play{ animation-delay: 0.15s; }
  .sparkle.s4.play{ animation-delay: 0.22s; }
  .sparkle.s5.play{ animation-delay: 0.05s; }
  @keyframes sparkleRise{
    0%{ opacity:0; transform: translateY(0) scale(0.5); }
    30%{ opacity:1; transform: translateY(-10px) scale(1); }
    100%{ opacity:0; transform: translateY(-70px) scale(1.2); }
  }

  .hp-panel.heal-pulse{
    animation: hpPulse 0.9s ease-out;
  }
  @keyframes hpPulse{
    0%{ box-shadow: 0 0 0 0 rgba(151,255,169,0); }
    30%{ box-shadow: 0 0 12px 3px rgba(151,255,169,0.9); }
    100%{ box-shadow: 0 0 0 0 rgba(151,255,169,0); }
  }

  /* ---------- Victory: hanko stamp + confetti ---------- */
  .hanko-stamp{
    position:absolute;
    top: 44%;
    left: 50%;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 4px solid #c0392b;
    box-shadow: 0 0 0 1px rgba(192,57,43,0.4) inset;
    color: #c0392b;
    display:flex;
    align-items:center;
    justify-content:center;
    writing-mode: vertical-rl;
    font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    background: rgba(244,241,224,0.06);
    opacity: 0;
    z-index: 12;
    pointer-events:none;
    transform: translate(-50%,-50%) scale(3) rotate(-10deg);
  }
  .hanko-stamp.play{
    animation: hankoStamp 0.55s cubic-bezier(.25,1.6,.4,1) forwards;
  }
  @keyframes hankoStamp{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(3) rotate(-10deg); }
    55%{ opacity:0.95; transform: translate(-50%,-50%) scale(0.88) rotate(-10deg); }
    75%{ opacity:0.95; transform: translate(-50%,-50%) scale(1.06) rotate(-10deg); }
    100%{ opacity:0.95; transform: translate(-50%,-50%) scale(1) rotate(-10deg); }
  }

  .confetti-container{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index: 14;
  }
  .confetti-piece{
    position:absolute;
    top:-16px;
    width: 7px;
    height: 12px;
    opacity: 0.95;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ top:-16px; opacity:1; transform: translateX(0) rotate(0deg); }
    85%{ opacity:1; }
    100%{ top:105%; opacity:0.85; transform: translateX(var(--drift)) rotate(var(--spin)); }
  }

  /* ---------- 裏面 (dark mode) ---------- */
  body.ura-mode{
    --window-bg: #180505;
    --window-border-outer: #5c1010;
    --window-border-inner: #d8c3c3;
    --text-main: #e9d9d9;
    --hp-green: #b23a3a;
    --hp-yellow: #c9552b;
    --hp-red: #8f1414;
    --accent-gold: #ff5c5c;
    --floor-1: #241010;
    --floor-2: #120707;
    --sky-top: #0c0505;
    --sky-bottom: #3a0f0f;
  }
  body.ura-mode .title-row{
    animation: uraFlicker 4s ease-in-out infinite;
  }
  @keyframes uraFlicker{
    0%, 92%, 100%{ opacity:1; }
    94%{ opacity:0.55; }
    96%{ opacity:0.9; }
  }
  body.ura-mode .stars{ opacity:0.35; }

  .ura-btn{
    margin-top: 8px;
    width: 100%;
    border-color: #ff5c5c !important;
    color: #ffb3b3;
  }
  .ura-btn .arrow{ color:#ff5c5c; }

  .lock-overlay{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 40%, rgba(140,0,0,0.5) 0%, rgba(5,0,0,0.9) 78%);
    opacity:0;
    z-index: 20;
    pointer-events:none;
    transition: opacity 1.2s ease-in;
  }
  .lock-overlay.show{ opacity:1; }

  .console.locked .cmd-btn{
    opacity: 0.25;
    pointer-events: none;
  }

  .speech-bubble{
    position:absolute;
    top: 8px;
    left: 50%;
    transform: translate(-50%, -12px);
    background: #fff;
    color:#1a1a2e;
    border: 2px solid #1a1a2e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    z-index: 7;
    transition: opacity 0.3s, transform 0.3s;
  }
  .speech-bubble::after{
    content:"";
    position:absolute;
    bottom:-8px;
    left:50%;
    transform: translateX(-50%);
    border-width: 8px 6px 0 6px;
    border-style: solid;
    border-color: #1a1a2e transparent transparent transparent;
  }
  .speech-bubble.show{
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- Message window ---------- */
  .message-window{
    margin-top: 10px;
    min-height: 58px;
    background: var(--window-bg);
    border: 3px solid var(--window-border-inner);
    box-shadow: 0 0 0 3px var(--window-border-outer);
    border-radius: 2px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: 0.5px;
  }
  .message-window .cursor{
    display:inline-block;
    width:8px; height:8px;
    background: var(--accent-gold);
    margin-left:4px;
    animation: blink 0.8s steps(1) infinite;
    vertical-align: -1px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- Command window ---------- */
  .command-row{
    margin-top: 10px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .cmd-btn{
    font-family: 'DotGothic16', sans-serif;
    font-size: 14px;
    color: var(--text-main);
    background: var(--window-bg);
    border: 3px solid var(--window-border-inner);
    box-shadow: 0 0 0 3px var(--window-border-outer);
    border-radius: 2px;
    padding: 12px 6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    transition: transform 0.08s;
  }
  .cmd-btn:active{ transform: scale(0.97); }
  .cmd-btn .arrow{
    color: var(--accent-gold);
    transition: transform 0.4s;
  }
  .cmd-btn:hover .arrow{ transform: translateX(3px); }
  .cmd-btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .cmd-btn:disabled .arrow{ transform:none; }

  /* ---------- Ura unlock button ---------- */
  .ura-row{
    margin-top: 8px;
  }
  .cmd-btn.ura-btn{
    width: 100%;
    background: #150505;
    border-color: #7a1010;
    color: #f2b6b0;
    box-shadow: 0 0 0 3px #3a0808;
    animation: uraPulse 1.6s ease-in-out infinite;
  }
  .cmd-btn.ura-btn .arrow{ color: #e0503a; }
  @keyframes uraPulse{
    0%, 100%{ box-shadow: 0 0 0 3px #3a0808; }
    50%{ box-shadow: 0 0 10px 3px rgba(224,80,58,0.55), 0 0 0 3px #3a0808; }
  }

  /* ---------- Permanent game-over state ---------- */
  .console.game-over{
    filter: grayscale(0.35) contrast(1.05);
  }
  .console.game-over .stage::after{
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(120,0,0,0.3) 0%, rgba(0,0,0,0.88) 75%);
    z-index: 20;
    animation: goVignette 1.4s ease-out forwards;
  }
  @keyframes goVignette{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }
  .console.game-over .cmd-btn{
    pointer-events: none;
    opacity: 0.3;
  }
</style>
</head>
<body>

<div class="console">
  <div class="title-row" id="titleRow">▼ てきを たおせ！ ▼</div>

  <div class="stage" id="stage">
    <div class="stars"></div>
    <div class="floor"></div>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="heal-flash" id="healFlash"></div>
    <div class="sparkles" id="sparkles">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✧</span>
      <span class="sparkle s3">✦</span>
      <span class="sparkle s4">✧</span>
      <span class="sparkle s5">✦</span>
    </div>
    <div class="hanko-stamp" id="hankoStamp">勝利</div>
    <div class="confetti-container" id="confettiContainer"></div>
    <div class="lock-overlay" id="lockOverlay"></div>

    <div class="enemy-zone">
      <div class="hp-panel">
        <div class="name-row">
          <span id="enemyName">なぞの てき</span>
          <span id="hpText">HP 100</span>
        </div>
        <div class="hp-bar-track">
          <div class="hp-bar-fill" id="hpBar"></div>
        </div>
      </div>

      <div class="enemy-frame" id="enemyFrame">
        <div class="speech-bubble show" id="speechBubble">きょうあくなすらいむだよ！</div>
        <div class="slash" id="slash1"></div>
        <div class="slash slash2" id="slash2"></div>
        <div class="damage-pop" id="damagePop">99</div>

        <div class="enemy-img-wrap" id="enemyImgWrap">
          <img id="enemyImg" src="" alt="てき">
        </div>
      </div>
    </div>
  </div>

  <div class="message-window" id="messageWindow">
    てきが あらわれた！<span class="cursor"></span>
  </div>

  <div class="command-row">
    <button class="cmd-btn" id="attackBtn">
      <span class="arrow">▶</span>こうげき
    </button>
    <button class="cmd-btn" id="resetBtn">
      <span class="arrow">▶</span>もういちど
    </button>
  </div>

  <button class="cmd-btn ura-btn" id="uraBtn" style="display:none;">
    <span class="arrow">▶</span>裏面
  </button>
</div>

<script>

  // ---------- Sound effects (synthesized, no external audio files) ----------
  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSlashSound(){
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    // Noise burst -> filtered "whoosh"
    const bufferSize = Math.floor(ctx.sampleRate * 0.22);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.setValueAtTime(4200, now);
    bandpass.frequency.exponentialRampToValueAtTime(700, now + 0.18);
    bandpass.Q.value = 0.9;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

    noise.connect(bandpass).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 0.22);

    // Short metallic "clang" tail
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1300, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.12);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.22, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(oscGain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  function playHealSound(){
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const t = now + i * 0.09;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  }

  function playDefeatSound(){
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    // Low descending "boom" as the enemy goes down
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.55);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.4, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(oscGain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.6);

    // Noise "crash" under it
    const bufferSize = Math.floor(ctx.sampleRate * 0.4);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.setValueAtTime(1800, now);
    lowpass.frequency.exponentialRampToValueAtTime(180, now + 0.4);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.4, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

    noise.connect(lowpass).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 0.42);
  }

  function playInstantDeathSound(){
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    // Sub-bass hit
    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(90, now);
    sub.frequency.exponentialRampToValueAtTime(28, now + 0.9);
    const subGain = ctx.createGain();
    subGain.gain.setValueAtTime(0.5, now);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
    sub.connect(subGain).connect(ctx.destination);
    sub.start(now);
    sub.stop(now + 1.1);

    // Dissonant high stab
    [880, 932.33].forEach((freq) => {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.75);
    });

    // Noise crash for impact
    const bufferSize = Math.floor(ctx.sampleRate * 0.5);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.setValueAtTime(2200, now);
    lowpass.frequency.exponentialRampToValueAtTime(150, now + 0.5);
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.45, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    noise.connect(lowpass).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 0.52);
  }

  function playFanfareSound(){
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    // Rising "ta-da-da-daaa" melody
    const melody = [
      { freq: 523.25, t: 0,    dur: 0.12 },
      { freq: 659.25, t: 0.12, dur: 0.12 },
      { freq: 783.99, t: 0.24, dur: 0.12 }
    ];
    melody.forEach((n) => {
      const t = now + n.t;
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.freq, t);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.26, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + n.dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + n.dur + 0.02);
    });

    // Final triumphant chord stab
    const tChord = now + 0.36;
    [783.99, 1046.5, 1318.5].forEach((freq) => {
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, tChord);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, tChord);
      gain.gain.exponentialRampToValueAtTime(0.13, tChord + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, tChord + 0.55);
      osc.connect(gain).connect(ctx.destination);
      osc.start(tChord);
      osc.stop(tChord + 0.58);
    });
  }

  function launchConfetti(count){
    const colors = ['#f2c14e', '#e0503a', '#5fd068', '#8bf08f', '#f4f1e0', '#4a4e8f'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const left = Math.random() * 100;
      const duration = 1.6 + Math.random() * 1.3;
      const delay = Math.random() * 0.35;
      const drift = Math.round(Math.random() * 70 - 35);
      const spin = Math.round(Math.random() * 520 + 180);
      el.style.left = left + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      el.style.setProperty('--drift', drift + 'px');
      el.style.setProperty('--spin', spin + 'deg');
      confettiContainer.appendChild(el);
      setTimeout(() => el.remove(), (duration + delay) * 1000 + 300);
    }
  }

  function triggerVictory(){
    playFanfareSound();
    launchConfetti(70);

    hankoStamp.classList.remove('play'); void hankoStamp.offsetWidth;
    hankoStamp.classList.add('play');

    setMessage('てきを たおした！<br>🎉 <strong>おめでとう！</strong> 🎉', false);
  }

  function revealUraButton(){
    if (uraBtn.style.display !== 'none') return;
    uraBtn.style.display = 'flex';
    setMessage('てきを たおした！<br>🎉 <strong>おめでとう！</strong> 🎉<br><br>……なにかが めを さました。', false);
  }

  function triggerInstantDeath(){
    locked = true;
    playInstantDeathSound();

    attackBtn.disabled = true;
    resetBtn.disabled = true;
    uraBtn.disabled = true;
    consoleEl.classList.add('locked');

    lockOverlay.classList.add('show');
    enemyFrame.classList.add('shake');

    setMessage(
      '……せんこうの いちげき。<br>' +
      '<strong>もう なにも できない。</strong><br>' +
      'ブラウザを とじる ほか ない。',
      false
    );
  }

  function enterUraMode(){
    if (uraMode || locked) return;
    uraMode = true;
    document.body.classList.add('ura-mode');
    uraBtn.style.display = 'none';

    document.getElementById('titleRow').textContent = '▼ 裏面：帰らずの戦場 ▼';
    enemyName.textContent = '深淵の てき';

    reviveEnemy();
    setMessage('……とびらが ひらいた。<br>ここから さきは ようしゃしない。', false);
  }

  function reviveEnemy(){
    hp = MAX_HP;
    defeated = false;
    busy = false;
    updateHpBar();
    enemyImg.src = uraMode ? ENEMY_IMG_URA : ENEMY_IMG_NORMAL;
    enemyFrame.classList.remove('defeated', 'shake', 'flash');
    speechBubble.textContent = 'きょうあくなすらいむだよ！';
    speechBubble.classList.add('show');
    hankoStamp.classList.remove('play');
    confettiContainer.innerHTML = '';
    attackBtn.disabled = false;
  }

  function setMessage(text, withCursor){
    messageWindow.innerHTML = text + (withCursor ? '<span class="cursor"></span>' : '');
  }

  function updateHpBar(){
    const pct = Math.max(hp, 0);
    hpBar.style.width = pct + '%';
    hpText.textContent = 'HP ' + pct;
    hpBar.classList.remove('mid', 'low');
    if (pct <= 25) hpBar.classList.add('low');
    else if (pct <= 60) hpBar.classList.add('mid');
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function attack(){
    if (defeated || busy || locked) return;
    busy = true;
    attackBtn.disabled = true;

    setMessage('こうげきした！', false);

    // wind-up shake, then slash + flash + damage
    await sleep(150);

    playSlashSound();

    screenFlash.classList.remove('play'); void screenFlash.offsetWidth;
    screenFlash.classList.add('play');

    slash1.classList.remove('play'); void slash1.offsetWidth;
    slash2.classList.remove('play'); void slash2.offsetWidth;
    slash1.classList.add('play');
    slash2.classList.add('play');

    enemyFrame.classList.remove('shake'); void enemyFrame.offsetWidth;
    enemyFrame.classList.add('shake', 'flash');

    // 裏面: 10回に1回、敵が即死攻撃を仕掛けてくる
    if (uraMode && Math.random() < URA_INSTANT_DEATH_CHANCE) {
      await sleep(400);
      triggerInstantDeath();
      return;
    }

    const dmg = uraMode ? URA_DAMAGE_PER_HIT : Math.min(hp, 25 + Math.floor(Math.random() * 20));
    damagePop.textContent = dmg;
    damagePop.classList.remove('play'); void damagePop.offsetWidth;
    damagePop.classList.add('play');

    await sleep(500);

    hp = Math.max(0, hp - dmg);
    updateHpBar();
    enemyFrame.classList.remove('shake', 'flash');

    if (hp <= 0) {
      defeated = true;
      playDefeatSound();
      enemyFrame.classList.add('defeated');
      speechBubble.textContent = 'ヤラレチャッタ…';
      speechBubble.classList.add('show');
      await sleep(300);
      setMessage('てきに とどめを さした！<br>てきは「<strong>ヤラレチャッタ…</strong>」', false);
      attackBtn.disabled = true;

      await sleep(900);
      triggerVictory();

      winCount++;
      if (!uraMode && winCount >= 10) {
        revealUraButton();
      }
    } else {
      setMessage('てきに ダメージを あたえた！<span class="cursor"></span>', true);
      attackBtn.disabled = false;
    }

    busy = false;
  }

  function reset(){
    if (locked) return;
    hp = MAX_HP;
    defeated = false;
    busy = false;
    updateHpBar();
    enemyImg.src = uraMode ? ENEMY_IMG_URA : ENEMY_IMG_NORMAL;
    enemyFrame.classList.remove('defeated', 'shake', 'flash');
    speechBubble.textContent = 'きょうあくなすらいむだよ！';
    speechBubble.classList.add('show');
    hankoStamp.classList.remove('play');
    confettiContainer.innerHTML = '';
    attackBtn.disabled = false;
    setMessage('てきは かいふくした！<span class="cursor"></span>', true);

    playHealSound();

    healFlash.classList.remove('play'); void healFlash.offsetWidth;
    healFlash.classList.add('play');

    hpPanel.classList.remove('heal-pulse'); void hpPanel.offsetWidth;
    hpPanel.classList.add('heal-pulse');

    sparkleEls.forEach((el) => {
      el.classList.remove('play'); void el.offsetWidth;
      el.classList.add('play');
    });
  }

  attackBtn.addEventListener('click', attack);
  resetBtn.addEventListener('click', reset);
  uraBtn.addEventListener('click', enterUraMode);

  enemyImg.src = ENEMY_IMG_NORMAL;
  updateHpBar();
})();
</script>
